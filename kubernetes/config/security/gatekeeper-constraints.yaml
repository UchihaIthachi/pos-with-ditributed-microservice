apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: pod-must-have-app-label
  namespace: security # Placing in the 'security' namespace
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "service" # Target the 'service' namespace
  parameters:
    labels: ["app"]
