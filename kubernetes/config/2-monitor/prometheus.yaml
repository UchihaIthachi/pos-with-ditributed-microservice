---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitor
  labels:
    app: prometheus
spec:
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 32103
  selector:
    app: prometheus
  type: NodePort
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus-pod
  namespace: monitor
  labels:
    app: prometheus
spec:
  containers:
    - name: prometheus-cont
      image: prom/prometheus:latest
      imagePullPolicy: Always
      ports:
        - protocol: TCP
          containerPort: 9090
      args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--web.enable-lifecycle" # Added to allow config reloading via HTTP
        - "--alertmanager.url=http://alertmanager:9093"
      volumeMounts:
      - name: config-volume
        mountPath: /etc/prometheus
      livenessProbe:
        httpGet:
          path: /
          port: 9090
        initialDelaySeconds: 120
      readinessProbe:
        httpGet:
          path: /
          port: 9090
        initialDelaySeconds: 30
        periodSeconds: 2
  volumes:
    - name: config-volume # Consolidated volume mount
      configMap:
        name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitor
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager.monitor.svc.cluster.local:9093
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
      # Add other scrape configs here if needed

  rules.yml: |
    groups:
    - name: example
      rules:
      - alert: TestAlert
        expr: vector(1)
        labels:
          severity: 'critical'
        annotations:
          summary: 'This is a test alert'
